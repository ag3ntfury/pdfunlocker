# Audit note: Corrected using official IndusInd statement example: first four name letters + DDMM. first_name is a proxy for registered name.
# Field IDs refer to the approved default_profile_template.yml.
rule:
  id: '00025'
  name: IndusInd Bank Statement Name + DOB
  category: banking
pattern:
  fields:
  - field_id: '1002'
    slice:
      mode: first
      count: 4
  - field_id: '1005'
    slice:
      mode: first
      count: 4
transform:
  cases:
  - lower
  - upper
  - raw
status: active
