# Audit note: Secondary reports only: last five mobile digits + DDMMYY. Not a universal SBI PDF rule.
# Field IDs refer to the approved default_profile_template.yml.
rule:
  id: '00014'
  name: SBI Emailed Account Statement Mobile + DOB
  category: banking
pattern:
  fields:
  - field_id: '1008'
    slice:
      mode: last
      count: 5
  - field_id: '1005'
    slice:
      mode: first
      count: 6
transform:
  cases:
  - lower
  - upper
  - raw
status: inactive
