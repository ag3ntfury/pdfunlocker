# Audit note: Secondary reports only for account statements; do not confuse with credit-card statement rule 00002.
# Field IDs refer to the approved default_profile_template.yml.
rule:
  id: '00023'
  name: ICICI Bank Account Statement Name + DOB
  category: banking
pattern:
  fields:
  - field_id: '1002'
    slice:
      mode: first
      count: 4
  - field_id: '1005'
    slice:
      mode: first
      count: 4
transform:
  cases:
  - lower
  - upper
  - raw
status: inactive
