# Audit note: Issuer format previously researched: first four cardholder-name letters + DDMM. Uses first_name as a proxy for the name printed on card.
# Field IDs refer to the approved default_profile_template.yml.
rule:
  id: '00002'
  name: ICICI Credit Card Name + DOB
  category: banking
pattern:
  fields:
  - field_id: '1002'
    slice:
      mode: first
      count: 4
  - field_id: '1005'
    slice:
      mode: first
      count: 4
transform:
  cases:
  - lower
  - upper
  - raw
status: active
