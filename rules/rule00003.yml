# Audit note: Issuer format previously researched: first four name letters + DDMM. Check account-holder name matching.
# Field IDs refer to the approved default_profile_template.yml.
rule:
  id: '00003'
  name: Federal Bank Name + DOB
  category: banking
pattern:
  fields:
  - field_id: '1002'
    slice:
      mode: first
      count: 4
  - field_id: '1005'
    slice:
      mode: first
      count: 4
transform:
  cases:
  - lower
  - upper
  - raw
status: active
