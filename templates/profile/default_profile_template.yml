# PDF Unlocker — Default Profile Template
# Release: Alpha v1
#
# This file defines the available profile fields.
# Actual personal values are stored separately in profiles/.
#
# FIELD ID RULES:
# S = Single value. The field ID is also the value ID.
# M = Multiple values. Append alphabetic suffixes.
#
# Examples:
# Single:   1001
# Multiple: 1008A, 1008B, 1008C ... 1008Z, 1008AA
#
# IDs are permanent and must never be reused.
# Rules must reference parent field IDs, not suffixed value IDs.
#
# DATE FORMAT:
# birth_date is stored as DDMMYYYY.

template:
  name: default_profile
  version: 1
  stage: alpha
  country_scope: IN

field_registry:

  # ==========================================
  # PERSONAL INFORMATION
  # ==========================================
  personal:

    - id: "1001"
      name: title
      type: string
      multiplicity: S

    - id: "1002"
      name: first_name
      type: string
      multiplicity: S

    - id: "1003"
      name: middle_name
      type: string
      multiplicity: S

    - id: "1004"
      name: last_name
      type: string
      multiplicity: S

    - id: "1005"
      name: birth_date
      type: date
      multiplicity: S
      format: DDMMYYYY

  # ==========================================
  # GOVERNMENT AND IDENTITY
  # ==========================================
  identity:

    - id: "1006"
      name: pan
      type: string
      multiplicity: S
      normalization: uppercase

    - id: "1007"
      name: pincode
      type: string
      multiplicity: S
      validation: "6 digits"

  # ==========================================
  # CONTACT INFORMATION
  # ==========================================
  contact:

    - id: "1008"
      name: mobile
      type: phone
      multiplicity: M

    - id: "1009"
      name: email
      type: email
      multiplicity: M

  # ==========================================
  # BANKING INFORMATION
  # ==========================================
  banking:

    - id: "1020"
      name: account_number
      type: string
      multiplicity: M

    - id: "1021"
      name: customer_id
      type: string
      multiplicity: M

    - id: "1023"
      name: crn
      type: string
      multiplicity: M

  # ==========================================
  # VEHICLE INFORMATION
  # ==========================================
  vehicle:

    - id: "1035"
      name: vehicle_registration_number
      type: string
      multiplicity: M
      normalization: uppercase

    - id: "1036"
      name: chassis_number
      type: string
      multiplicity: M
      normalization: uppercase
