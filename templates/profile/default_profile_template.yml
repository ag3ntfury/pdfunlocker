# PDF Unlocker — Default Profile Template
# Version 1
#
# This file defines the available profile fields.
# Actual personal values are stored separately in profiles/.
#
# FIELD ID RULES:
# S = Single value. The field ID is also the value ID.
# M = Multiple values. Append alphabetic suffixes.
#
# Examples:
# Single:   1001
# Multiple: 1008A, 1008B, 1008C ... 1008Z, 1008AA
#
# IDs are permanent and must never be reused.
# Rules must reference parent field IDs, not suffixed value IDs.

template:
  name: default_profile
  version: 1
  country_scope: IN

field_registry:

  # ==========================================
  # PERSONAL INFORMATION
  # ==========================================
  personal:

    # Personal title: Mr, Mrs, Ms, Dr, etc.
    - id: "1001"
      name: title
      type: string
      multiplicity: S

    # Given name of the profile owner.
    - id: "1002"
      name: first_name
      type: string
      multiplicity: S

    # Middle name. Can be used to generate initials.
    - id: "1003"
      name: middle_name
      type: string
      multiplicity: S

    # Family name or surname.
    - id: "1004"
      name: last_name
      type: string
      multiplicity: S

    # Date of birth.
    # Stored as YYYY-MM-DD; password rules can use other formats.
    - id: "1005"
      name: birth_date
      type: date
      multiplicity: S
      format: YYYY-MM-DD

  # ==========================================
  # GOVERNMENT AND IDENTITY
  # ==========================================
  identity:

    # Permanent Account Number.
    - id: "1006"
      name: pan
      type: string
      multiplicity: S
      normalization: uppercase

    # Six-digit Indian postal PIN code.
    - id: "1007"
      name: pincode
      type: string
      multiplicity: S
      validation: "6 digits"

  # ==========================================
  # CONTACT INFORMATION
  # ==========================================
  contact:

    # Mobile numbers associated with the profile.
    - id: "1008"
      name: mobile
      type: phone
      multiplicity: M

    # Email addresses associated with the profile.
    - id: "1009"
      name: email
      type: email
      multiplicity: M

  # ==========================================
  # BANKING INFORMATION
  # ==========================================
  banking:

    # Bank account numbers belonging to the profile owner.
    - id: "1020"
      name: account_number
      type: string
      multiplicity: M

    # Customer identification numbers assigned by banks.
    - id: "1021"
      name: customer_id
      type: string
      multiplicity: M

    # Customer Relationship Numbers (CRN) assigned by banks.
    - id: "1023"
      name: crn
      type: string
      multiplicity: M

  # ==========================================
  # VEHICLE INFORMATION
  # ==========================================
  vehicle:

    # Vehicle registration number, for example GJ10AB1234.
    - id: "1035"
      name: vehicle_registration_number
      type: string
      multiplicity: M
      normalization: uppercase

    # Vehicle chassis number or VIN.
    - id: "1036"
      name: chassis_number
      type: string
      multiplicity: M
      normalization: uppercase
