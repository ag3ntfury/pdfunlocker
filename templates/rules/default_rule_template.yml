# PDF Unlocker — Default Rule Template
# Release: Alpha v1
#
# RULE ID:
# - Unique five-digit string.
# - Never reuse an assigned rule ID.
#
# PATTERN:
# - Reference Profile Template field IDs only.
# - Multiple fields are concatenated in listed order.
# - Multiple-value profile fields must be evaluated value by value.
#
# SLICING:
# - first: first N characters.
# - last: last N characters.
# - full: complete field value.
# - count is required for first and last; omitted for full.
#
# DATE:
# - Profile DOB is stored as DDMMYYYY.
# - Slice the stored value; do not assume another date format.
#
# TRANSFORMATIONS:
# - Always retain lower, upper, and raw.
# - Duplicate generated candidates should be deduplicated by the engine.
#
# STATUS:
# - active or inactive.

rule:
  id: "00000"
  name: "REPLACE_WITH_RULE_NAME"
  category: "REPLACE_WITH_CATEGORY"

pattern:
  fields:
    - field_id: "1002"
      slice:
        mode: first
        count: 4

    - field_id: "1008"
      slice:
        mode: last
        count: 4

transform:
  cases:
    - lower
    - upper
    - raw

status: inactive
