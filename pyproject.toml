[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfunlocker"
version = "1.3.3a1"
description = "Local PDF management and password recovery utility"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
pdfunlocker = "pdfunlocker.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "backups",
    "pdfunlocker_v1_1_ranking_implementation",
    ".git",
    ".venv",
    "venv"
]
